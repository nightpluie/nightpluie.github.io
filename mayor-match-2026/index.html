*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--bar) + 56px);overflow-anchor:none;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.55 var(--sans);min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4,p,ol,ul,blockquote{margin:0}
button,select,summary{font:inherit;color:inherit;cursor:pointer}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-underline-offset:4px}
button,select{font-synthesis:none}
button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h1:focus{outline:none}
.clause{display:inline-block;max-width:100%}.unit{display:inline-block;white-space:pre}
.nojs{padding:24px 4px;font-weight:700}
.wrap{width:min(100%,446px);margin:0 auto;padding:0 13px 32px}
body[data-view=home] .wrap{width:min(100%,600px)}
.tools,.mast,.register,.register>span,.cover-meta,.primary,.folio,.folio strong,.field,.paper-foot,.identity,.end-controls{display:flex;align-items:center}
.mast{gap:10px;padding:9px 1px;min-height:46px;border-bottom:1px solid var(--rule);font-size:12px;position:sticky;top:0;z-index:8;background:var(--bg)}
.brand{display:block;flex:none;width:115px;height:18px;background:url("https://events.ettoday.net/et-topic/images/bg_header.png") left center/auto 18px no-repeat}
#mute,.mute-btn{margin-left:auto;flex:none;display:flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:5px 8px;min-height:32px;font-size:12px;color:var(--ink)}
#mute svg,.mute-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mute-btn[aria-pressed=false] .cross,.mute-btn[aria-pressed=true] .waves{display:none}
main{padding-top:19px}
.paper{background:var(--paper);border:1px solid var(--rule);border-radius:6px;position:relative}
.sheet{box-shadow:0 4px 0 -1px var(--wash),0 5px 0 -1px var(--rule),0 9px 0 -3px var(--wash),0 10px 0 -3px var(--rule)}
.register,.field,.folio,.paper-foot,.end-controls{justify-content:space-between}
.register{padding:15px 21px 0;font-size:12px;color:var(--muted);font-weight:700}
.register>span{gap:8px}
.register time,.counter,.field{font-variant-numeric:tabular-nums}
.register time{letter-spacing:.1em;font-size:12px}
.fileicon{display:inline-block;width:17px;height:13px;position:relative;border:1.6px solid currentColor;border-radius:2px;color:inherit;flex:none}
.fileicon:before{content:"";position:absolute;top:-4px;left:-1.5px;width:7px;height:3px;border:1.5px solid currentColor;border-bottom:0;border-radius:2px 2px 0 0}
.fileicon:after{content:"";position:absolute;inset:4px 2px auto;height:1px;background:currentColor}
.home-grid{display:flex;flex-direction:column}
.home-left{display:contents}
.hero{order:1;padding:2px 2px 0;position:relative}
.kicker{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
.steps{order:2;list-style:none;margin:12px 0 0;padding:0;display:grid;gap:5px}
.steps li{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.45}
.step-no{flex:none;width:20px;height:20px;border-radius:50%;background:var(--spot);color:var(--on-spot);font-weight:900;font-size:12px;display:grid;place-items:center;margin-top:1px}
.step-text{min-width:0}
.map-card{order:3;margin-top:14px;padding:10px 8px;background:var(--paper);border:1px solid var(--rule);border-radius:6px}
.choose{display:contents}
.choose .selector-title{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fallback{order:4}.picked{order:5}
.hero h1{font:900 clamp(32px,9.8vw,40px)/1.3 var(--title);letter-spacing:-.04em}
.hero h1 em{color:var(--ink);font-style:normal;text-decoration:underline var(--spot) .12em;text-underline-offset:.06em;text-decoration-skip-ink:none}
.desktop-art{display:block;width:100%;height:auto;--art-line:var(--ink);--art-mid:var(--rule);--art-face:var(--paper);--shadow:var(--rule)}
.plate-text{font:700 15px var(--title);letter-spacing:.04em;fill:var(--ink)}
.plate-face{fill:var(--spot)}
.lead{font-size:16px;line-height:1.65}
.hero .lead{margin:8px 0 0;font-size:14px;line-height:1.6;color:var(--muted)}
.hero .desktop-art{display:none}
.primary{width:100%;min-height:47px;gap:12px;justify-content:center;border:0;border-radius:5px;background:var(--spot);color:var(--on-spot);font-weight:700;box-shadow:0 3px 0 var(--ink)}
.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.result-jump{border:0;background:transparent;padding:4px 0;min-height:38px}
.map-down{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}
.lead,.method li,.zero{text-wrap:pretty}
.text-button,.link,.result-jump{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:4px}
.text-button{border:0;background:transparent;min-height:38px;padding:4px 1px}
.footer{border-top:1px solid var(--rule);margin:30px 0 0;padding:20px 2px 12px;color:var(--muted);font-size:14px;line-height:1.95}
.footer p{margin:0}.footer nav{display:flex;flex-wrap:wrap;gap:2px 18px;margin:8px 0 10px}.footer nav a{display:inline-block;padding:7px 0}
.footer-brand{font-weight:900;font-size:17px;color:var(--ink)}.footer-brand a{text-decoration:none}
.footer-credit{white-space:nowrap}
body[data-view=flow] .footer{display:none}

/* 首頁：地圖與資訊列 */
.selector-title{font:900 22px/1.3 var(--title);letter-spacing:-.02em}

.map-stage{width:100%;max-width:520px;margin:0 auto;background:radial-gradient(ellipse at 55% 42%,#f8f6f0 0%,var(--map-sea) 72%);border-radius:10px}
.map{display:block;width:100%;height:auto;overflow:visible;user-select:none;-webkit-user-select:none}
.county,.call{cursor:pointer;-webkit-tap-highlight-color:transparent}
.county path{fill:var(--map);stroke:var(--map-stroke);stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.county text{font-family:var(--sans);font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.county:hover path{fill:var(--map-hover)}
.county:focus{outline:none}
.county:focus-visible path,.call:focus-visible rect{stroke:var(--ink);stroke-width:3}
.county[aria-pressed=true] path{fill:var(--spot)}
.call:focus{outline:none}
.call rect{fill:var(--paper);stroke:var(--map-line);stroke-width:1;rx:7}
.call text{font-family:var(--sans);font-weight:700;font-size:12px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.call .island-shape{fill:#706b64}
.call[aria-pressed=true] rect{fill:var(--spot);stroke:var(--ink)}
.call[aria-pressed=true] .island-shape{fill:var(--ink)}
.leaders{pointer-events:none}
.leaders line{stroke:var(--ink);stroke-width:1.2}
.leaders circle{fill:var(--ink)}
.fallback{margin-top:12px;font-size:13px;color:var(--muted);padding-inline:2px}
.fallback label{display:block;margin-bottom:5px}
.fallback select{width:100%;height:44px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);padding:0 11px;color:var(--ink)}
.home-grid{display:block}
.picked{position:sticky;bottom:8px;z-index:3;margin:14px 6px 0}
.flow{display:block}
.nameplate,.side-count,.side-tools{display:none}
.desk-side .mute-btn{margin:0}
.picked:empty{display:none}
.picked-card{background:var(--paper);border:1px solid var(--ink);border-radius:8px;padding:12px 14px 14px;box-shadow:0 4px 0 -1px var(--wash),0 8px 18px rgba(40,40,36,.18)}
.picked-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 9px;color:var(--muted);font-size:12px;font-weight:700}
.picked-head b{background:var(--tint);color:var(--ink);border-radius:5px;padding:3px 9px;font-size:14px;border-left:4px solid var(--spot)}
.picked-head span+span{border-left:1px solid var(--rule);padding-left:9px}
.picked .role{margin:9px 0 10px;font-size:14px;font-weight:700}
.picked-hint{color:var(--muted);font-size:13px}

/* 題目 */
.folio{padding:0 2px}
.folio strong{gap:9px;color:var(--ink);font:900 18px var(--title)}
.counter{font-size:12px;color:var(--muted)}
.counter b{font:900 31px/1 var(--title);letter-spacing:-.04em;color:var(--ink)}
.meter{display:flex;gap:3px;margin:9px 1px 15px}
.meter i{flex:1;height:5px;border-radius:4px;background:var(--wash);min-width:0}
.meter .done{background:var(--muted)}
.meter .current{background:var(--spot);outline:1px solid var(--ink);outline-offset:-1px}
.sheet{padding:14px 15px 6px}
.field{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.045em}
.sheet .field{border-bottom:1px dashed var(--rule);padding-bottom:9px}
.tab{padding:2px 8px;border-radius:4px;background:var(--tint);color:var(--ink);border-left:3px solid var(--spot)}
.question-title,.section-title{font:900 26px/1.29 var(--title);letter-spacing:-.03em;margin:14px 0 6px}
.hint{color:var(--muted);font-size:13px;margin:5px 0 12px}
.cards{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-rows:auto;gap:8px}
.card{position:relative;isolation:isolate;min-width:0;width:100%;display:block;padding:0;text-align:left;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;box-shadow:0 2px 0 var(--wash);font-weight:700;font-size:17px;line-height:1.48;scroll-margin-block:6px 60px}
.summary{display:flex;align-items:center;min-height:76px;padding:10px 14px}
.card[aria-pressed=true]{background:transparent;border-color:transparent;box-shadow:none}
.card-surface{position:absolute;inset:-1px;z-index:-1;background:var(--paper);border:1px solid var(--spot);border-radius:inherit;box-shadow:0 0 0 1px var(--spot);transform-origin:top}
.cards:not(.multi):has(.approval) .card[aria-pressed=false]{color:var(--muted);background:var(--wash);box-shadow:none}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0}
.action{background:var(--bg);border:1px solid var(--rule);border-radius:4px;min-height:40px;font-size:14px;color:var(--muted)}
.action[aria-pressed=true]{background:var(--wash);color:var(--ink);border-color:var(--spot);box-shadow:inset 0 0 0 1px var(--spot)}
.paper-foot{border-top:1px dashed var(--rule);min-height:42px}
.receipt{color:var(--muted);font-size:12px}
.receipt.file-mark{border:1px solid var(--rule);padding:2px 6px;border-radius:3px}
.receipt:not(:empty){color:var(--ink);background:var(--tint);padding:2px 6px;border-left:3px solid var(--spot);border-radius:2px}
.receipt.file-mark{border:1px solid var(--rule);border-left:3px solid var(--spot)}
.approval{display:block;position:relative;height:calc(138px * var(--k));margin:0 12px;border-top:1px dashed var(--rule);transform-origin:top}
.approval::before{content:"批示";position:absolute;top:8px;left:2px;font:400 12px/1.4 var(--sans);letter-spacing:.12em;color:var(--muted)}
.seal,.stamp-seat{position:absolute;right:calc(28px * var(--k));top:calc(38px * var(--k));width:calc(132px * var(--k));height:calc(88px * var(--k));transform:rotate(-3deg);pointer-events:none}
.seal{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--stamp);user-select:none;line-height:1}
.seal::before{content:"";position:absolute;inset:0;border:calc(4px * var(--k)) solid currentColor;border-radius:7px 5px 8px 4px;mask-image:var(--wear);-webkit-mask-image:var(--wear);mask-size:100% 100%;-webkit-mask-size:100% 100%}
.seal b{font:900 calc(39px * var(--k))/1.03 var(--title);letter-spacing:.06em}
.seal small{font:700 calc(12px * var(--k))/1.3 var(--sans);margin-top:3px;padding:2px 1px 0;border-top:2px solid;white-space:nowrap}
.stamp-tool,.stamp-shadow,.near-shadow{position:absolute;inset:-6px;pointer-events:none;border-radius:9px}
.stamp-tool svg{display:block;width:200%;height:200%;overflow:visible;transform:scale(.5);transform-origin:top left}
.stamp-tool .grip-wood{transform:translate(1px,2px) scale(.9)}
.sleeve{display:none}
.desk-gesture{position:fixed;inset:0;overflow:clip;pointer-events:none;z-index:6}
.desk-gesture .sleeve{display:inline}
.desk-gesture .stamp-seat{top:0;left:0;right:auto}
.near-shadow{background:var(--ink);filter:blur(1px)}
.stamp-shadow{background:var(--ink);filter:blur(7px)}
main:has(.sheet){overflow-x:clip;margin-inline:-13px;padding-inline:13px;padding-bottom:14px}
@keyframes file-away{to{opacity:0;transform:translate(-8px,-3px) rotate(-.6deg)}}
@keyframes arrive{from{opacity:0;transform:translate(4px,3px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:no-preference){
.sheet.depart{animation:file-away 80ms ease-in both}.sheet.enter{animation:arrive 76ms ease-out both}}

/* 結果、逐題回顧、方法 */
.result,.review,.method{padding:18px}
.review,.method{margin-top:15px}
.result .lead{margin:12px 0}
.result-jump{display:inline-block;margin-bottom:15px}
.people{list-style:none;padding:0}
.people li{border-top:1px solid var(--rule);padding:15px 0}
.identity{gap:8px;flex-wrap:wrap}
.identity b{font-size:20px}
.num{background:var(--wash);padding:2px 7px;border-radius:4px;font-size:12px;font-weight:700}
.party{color:var(--muted);font-size:13px}
.stat{font-size:15px;margin:5px 0}
.zero{font-size:14px;color:var(--muted)}
.link{display:inline-block;padding:7px 0}
.review details{border-top:1px solid var(--rule)}
.review summary{position:relative;padding:14px 16px 14px 0;list-style:none;font-weight:700}
.review summary::-webkit-details-marker{display:none}
.review summary small{display:block;font-size:12px;color:var(--muted)}
.review summary:before,.review summary:after{content:"";position:absolute;width:10px;height:2px;background:var(--muted);right:1px;top:22px}
.review summary:after{transform:rotate(90deg)}
.review details[open]>summary:after{display:none}
.review-answer{font-size:14px;background:var(--wash);padding:7px 9px;border-radius:4px}
.review-card{padding:13px 0;border-bottom:1px dotted var(--rule)}
.review-card:last-child{border:0}
.review-card h4{font-size:16px}
.review-card p{font-size:14px;margin-top:5px}
.source{margin-top:8px}
.source b{font-size:13px}
.source blockquote{font-size:15px;border-left:2px solid var(--rule);padding-left:8px;margin-top:4px;overflow-wrap:anywhere}
.end-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;align-items:stretch}
.end-controls .text-button{min-height:50px;padding:8px 6px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font-size:15px;font-weight:700;line-height:1.3;text-decoration:none}
.end-controls a.link,.notice a.link,.people+a.link{display:flex;align-items:center;justify-content:center;min-height:54px;padding:10px 14px;border:2px solid var(--spot);border-radius:8px;background:var(--tint);color:var(--ink);font-size:16px;font-weight:900;line-height:1.35;text-align:center;text-decoration:none}
.end-controls a.link{grid-column:1/-1;order:-1}
.notice a.link,.people+a.link{margin-top:14px}
.end-controls .text-button:hover,.end-controls a.link:hover,.notice a.link:hover,.people+a.link:hover{border-color:var(--ink)}
.end-controls .share-note{grid-column:1/-1;color:var(--muted);font-size:13px}
.section-title{margin-top:10px}
.method ul{padding-left:1.2em;font-size:14px;line-height:1.7}
.method li{margin-top:5px}
.method li::marker{color:var(--spot)}
.notice h1{font:900 26px/1.29 var(--title);letter-spacing:-.03em;margin:12px 0 8px}

@media(min-width:700px){body[data-view=home] main{padding-top:24px}.brand{width:165px;height:26px;background-size:auto 26px}.mast{padding-block:12px}}
@media(max-width:340px){.mast{gap:6px}.brand{width:96px;height:15px;background-size:auto 15px}#mute{padding:5px 6px;gap:3px;font-size:11px}}

@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* 逐題回顧：題與題、做法與做法、做法裡的摘要／誰寫的／原句，三層分開 */
.review details.rq{margin-top:24px;border:1px solid var(--rule);border-left:6px solid var(--spot);border-radius:6px;background:var(--wash)}
.review details.rq:first-of-type{margin-top:12px}
.rq summary{display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:13px 32px 13px 14px}
.rq summary:before,.rq summary:after{right:12px;top:24px}
.qtag{background:var(--spot);color:var(--on-spot);font-size:12px;font-weight:700;padding:2px 9px;border-radius:4px;letter-spacing:.06em}
.qtitle{font-size:17px;line-height:1.45}
.rq-body{padding:0 12px 14px}
.rq-label{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 2px;letter-spacing:.06em}
.mine-label{color:var(--ink);border-left:3px solid var(--spot);padding-left:7px}
.review .review-card{margin-top:8px;padding:12px;border:1px solid var(--rule);border-radius:5px;background:var(--paper)}
.review .review-card:last-child{border:1px solid var(--rule)}
.review .review-card.mine{border:2px solid var(--spot);background:var(--tint);padding:11px}
.review .review-card h4{font-size:17px;line-height:1.45}
.review .review-card .both{font-size:13px;color:var(--muted);margin-top:4px}
.review .source{margin-top:10px}
.review .source blockquote{background:var(--wash);border-left:3px solid var(--rule);padding:6px 9px;color:var(--muted);border-radius:0 4px 4px 0}
.review .review-card.mine .source blockquote{background:var(--paper)}
.review .review-answer{background:var(--tint);border:2px solid var(--spot);padding:10px 12px;font-weight:700;border-radius:5px;margin-top:8px}

@media(max-width:340px){.rq summary{padding-right:28px}}
body[data-view=none] .notice .link{display:inline-block}

/* 桌機版（960px 以上）：960px 以下維持手機版面 */
@media(min-width:960px){
  :root{--k:1.3}
  body[data-view] .wrap{width:min(100%,980px);padding-inline:20px}
  main{padding-top:28px}
  main:has(.sheet){margin-inline:0;padding-inline:0;overflow:visible}
  .mast{padding-block:14px}
  body[data-view=flow] #mute{display:none}
  /* 首頁：左欄標題與名牌，右欄地圖 */
  main{padding-top:20px}
  .home-grid{display:grid;grid-template-columns:minmax(0,42fr) minmax(0,58fr);gap:36px;align-items:stretch;min-height:calc(100vh - 170px)}
  .home-left{display:flex;flex-direction:column;justify-content:center;gap:24px;min-width:0}
  .hero{order:0;padding:0;display:flex;flex-direction:column;align-items:flex-start}
  .kicker{font-size:14px;margin-bottom:8px}
  .hero h1{font-size:clamp(44px,4.1vw,52px);letter-spacing:-.03em;line-height:1.28}
  .hero .lead{font-size:17px;margin-top:12px;color:var(--ink)}
  .hero .desktop-art{display:block;position:static;order:-1;width:150px;margin:0 0 10px;border-radius:8px}
  .steps{order:0;margin:0;gap:12px}
  .steps li{font-size:18px;gap:12px;line-height:1.45}
  .step-no{width:30px;height:30px;font-size:16px;margin-top:0}
  .choose{display:block;order:0;min-height:230px}
  .choose .selector-title{position:static;width:auto;height:auto;clip:auto;overflow:visible;font-size:20px;margin:0 0 10px}
  .fallback{order:0;margin:0 0 14px}
  .picked{order:0;position:static;margin:0}
  .map-card{order:0;margin:0;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,var(--paper),#f6f2ea);border-radius:10px}
  .map-stage{width:min(100%,calc((100vh - 195px) * .5586));max-width:none;margin:0 auto}
  .footer{font-size:15px}
  .footer-brand{font-size:19px}
  /* 題目：左欄是桌面上的東西，右欄是公文 */
  .flow{display:grid;grid-template-columns:280px minmax(0,640px);gap:40px;justify-content:center;align-items:start}
  .desk-side{position:sticky;top:84px}
  .nameplate{display:block;background:var(--spot);color:var(--on-spot);border:1.5px solid var(--ink);border-radius:5px;padding:12px 16px;box-shadow:0 4px 0 var(--ink);transform:rotate(-2deg);margin:4px 0 22px}
  .nameplate small{display:block;font-size:13px;font-weight:700;letter-spacing:.08em}
  .nameplate b{display:block;font:900 28px/1.25 var(--title);letter-spacing:.02em}
  .desk-side .folio strong{display:none}
  .desk-side .folio{justify-content:flex-start}
  .side-count{display:block;font-size:14px;color:var(--muted);margin:0 2px 18px}
  .side-tools{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  .side-tools .mute-btn{margin-left:0}
  .paper-foot .foot-back{display:none}
  .paper-foot{justify-content:flex-end}
  .question-title{font-size:32px}
  .card{font-size:19px}
  .summary{min-height:84px;padding:12px 18px}
  .sheet{padding:18px 22px 8px}
  /* 結果：左欄名單，右欄逐題回顧 */
  .result-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px 32px;align-items:start}
  .result-left{position:sticky;top:var(--left-top,76px);align-self:start;padding-bottom:6px}
  .result-right{margin-top:0}
  /* 沒有題目的縣市 */
  body[data-view=none] main>*{max-width:720px;margin-inline:auto}
}

/* 三張卡以上：可以複選，批完再按「批完，下一件」 */
.done-bar{margin:12px 0 0;padding:0}
.done-bar.pinned{position:sticky;bottom:0;z-index:4;margin-inline:-15px;padding:10px 15px 6px;background:var(--paper);border-top:1px solid var(--rule);box-shadow:0 -6px 12px -8px rgba(40,40,36,.35)}
@media(min-width:960px){.done-bar.pinned{margin-inline:-22px;padding-inline:22px}}
.done-bar .primary{min-height:50px}
.primary:disabled{background:var(--wash);color:var(--muted);box-shadow:none;cursor:not-allowed;border:1px solid var(--rule)}
.done-note{margin-top:5px;min-height:1.2em;text-align:center;font-size:12px;color:var(--muted)}

/* 方法與題目設計：預設收合，點擊展開 */
.method{padding:0;margin-top:18px}
.method summary{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:10px 18px;font:900 18px/1.3 var(--title);letter-spacing:-.01em;list-style:none;cursor:pointer}
.method summary::-webkit-details-marker{display:none}
.method .pm{position:relative;flex:none;width:22px;height:22px}
.method .pm:before,.method .pm:after{content:"";position:absolute;left:3px;right:3px;top:10px;height:2px;border-radius:1px;background:var(--ink)}
.method .pm:after{transform:rotate(90deg)}
.method[open] .pm:after{display:none}
.method-body{padding:0 18px 16px;border-top:1px dashed var(--rule)}
.method .method-body ul{margin-top:12px}
.method[open] summary{border-bottom:0}
.cards.multi .card{scroll-margin-block:6px 130px}
.result-method{margin-top:0}

</style>

<details class="paper method">
  <summary><span>方法與題目設計</span><i class="pm" aria-hidden="true"></i></summary>
  <div class="method-body">
  <ul>
    <li>所有政策選項都出自中央選舉委員會公布的各縣市首長選舉公報，揭曉時會顯示公報原句。</li>
    <li>至少兩位候選人在公報上對同一件事各自提出具體做法、而且做法不同，才成一題。</li>
    <li>兩位以上候選人寫了同一項做法時，只出一張卡，揭曉時每位都算一個。</li>
    <li>三種以上做法的題目可以選不只一個，你選的每一個都算。</li>
    <li>「都支持」等於每個做法都選；「都不支持」與「略過」不算進任何一位候選人。</li>
    <li>有些候選人沒有出現在題目裡：題目只收錄至少兩位候選人對同一件事各自提出具體做法、而且做法不同的情況。</li>
    <li>我們不會留存你的作答，也不會公布。</li>
  </ul>

<script>
'use strict';
/* 資料一律從 #app-data 與 #map-data 讀；作答只存在記憶體。 */
const data = JSON.parse(document.querySelector('#app-data').textContent);
let mapData = null;
try { mapData = JSON.parse(document.querySelector('#map-data').textContent); } catch (error) { mapData = null; }
const counties = data.counties;
const main = document.querySelector('#main');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const actions = {all:'都支持', none:'都不支持', skip:'略過'};
const notes = {all:'併案辦理', none:'另案研議', skip:'這件先擱著'};
const RULE = '題目只收錄至少兩位候選人在公報上對同一件事各自提出具體做法、而且做法不同的情況。';
const NOTE_ABSENT = '他沒有出現在這個縣市的題目裡。' + RULE;
const NOTE_HELD = '這次刊出的題目沒有收錄他的做法。他談到的題目還在確認公報內容，暫時沒有刊出。';
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
const unit = text => '<span class="unit">' + esc(text) + '</span>';
const seg = text => text.split('|').map(unit).join('<wbr>');
const segments = list => list.map(unit).join('<wbr>');
const pad = number => String(number).padStart(2, '0');
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const sources = card => (card.type === 'shared' ? card.sources : [card]).slice().sort((a,b) => a.candidate - b.candidate);
const byName = new Map(counties.map(c => [c.county, c]));

let place = null;      // 目前選的縣市資料
let selected = null;   // 首頁地圖上選到的縣市資料
let index = 0;
let answers = [];
let orders = [];
let busy = false;
let pendingState = null;
let run = 0;           // 每次開始作答加一，用來讓舊的歷史紀錄失效

/* ---------- 共用小工具 ---------- */
const candidateOf = n => place.candidates.find(c => c.number === n);
const officeTitle = c => c.county.slice(0,-1) + c.office;
const partyText = party => party === '無' ? '無推薦政黨' : party;
function shuffledIndices(cards) {
  const order = cards.map((_,i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return order;
}
// 斷詞只在接回去等於原字串時才使用；否則照原字串顯示，確保畫面文字與資料逐字相同。
function typeset(segs, text) {
  return Array.isArray(segs) && segs.length && segs.join('') === text ? segments(segs) : esc(text);
}
function promptHTML(question) {
  const ok = Array.isArray(question.prompt_segments) && question.prompt_segments.join('') === question.prompt;
  const parts = ok ? question.prompt_segments : [question.prompt];
  const split = parts.findIndex(term => /[，、]$/.test(term)) + 1;
  const groups = split > 0 && split < parts.length ? [parts.slice(0,split), parts.slice(split)] : [parts];
  return groups.map(clause => '<span class="clause">' + segments(clause) + '</span>').join('<wbr>');
}
function focusTop() {
  window.scrollTo(0,0);
  main.querySelector('[tabindex="-1"]')?.focus({preventScroll:true});
}
function setView(view) { document.body.dataset.view = view; }
function methodHTML() { return document.querySelector('#method-tpl').innerHTML; }
function fillSegments(root) {
  root.querySelectorAll('[data-seg]').forEach(el => { el.innerHTML = seg(el.dataset.seg); });
}

/* ---------- 歷史：上一頁回到上一個畫面 ---------- */
const HOME = {s:'home'};
const isAnswered = a => !!a && (!!a.action || (Array.isArray(a.cards) && a.cards.length > 0));
function firstUnanswered() {
  for (let k = 0; k < place.questions.length; k++) if (!isAnswered(answers[k])) return k;
  return -1;
}
// 歷史紀錄只是「想去的畫面」；實際畫面一律依目前的作答狀態校正，題序與選擇不會錯亂。
function validState(st) {
  if (!st || !st.s) return HOME;
  if (st.s === 'home') return HOME;
  if (!place || st.c !== place.county || (st.s !== 'none' && st.r !== run)) return HOME;
  const total = place.questions.length;
  if (st.s === 'none') return total === 0 ? st : HOME;
  if (!total || orders.length !== total) return HOME;
  const open = firstUnanswered();
  if (st.s === 'q') {
    const i = Number.isInteger(st.i) ? Math.max(0, Math.min(st.i, total - 1)) : 0;
    return stateOf('q', open === -1 ? i : Math.min(i, open));
  }
  if (st.s === 'result') return open === -1 ? st : stateOf('q', open);
  return HOME;
}
function render(st, enter = false) {
  switch (st.s) {
    case 'q': index = st.i; drawQuestion(enter); break;
    case 'result': drawResult(); break;
    case 'none': drawNone(); break;
    default: drawHome();
  }
}
function stateOf(s, i) { return {s, i, c:place.county, r:run}; }
function go(st, enter = false) {
  history.pushState(st, '');
  render(st, enter);
}
window.addEventListener('popstate', event => {
  const st = validState(event.state);
  if (busy) { pendingState = st; return; }
  render(st);
});

/* ---------- 首頁與地圖 ---------- */
const STAGE = {w:324, h:580};
const MAIN_AT = {x:40, y:50, k:280 / 300};
const CALLOUTS = {
  '臺北市':{x:205, y:0, side:'bottom'},
  '基隆市':{x:264, y:0, side:'bottom'},
  '新竹市':{x:68, y:120, side:'right'},
  '嘉義市':{x:0, y:272, side:'right'}
};
const ISLANDS = {'連江縣':{x:0, y:140}, '金門縣':{x:0, y:205}, '澎湖縣':{x:0, y:415}};
const CALL_W = 50, CALL_H = 44, ISLAND_W = 52, ISLAND_H = 54;
const BASE_FONT = 13.5;
function labelFont(c) {
  const chars = [...c.short].length;
  return Math.min(BASE_FONT, c.label_radius / Math.hypot(chars / 2, .6));
}
function countyRegion(c) {
  const label = c.outside ? '' : '<text x="' + c.label[0] + '" y="' + c.label[1] + '" style="font-size:' +
    labelFont(c).toFixed(2) + 'px">' + esc(c.short) + '</text>';
  return '<g class="county" role="button" tabindex="0" aria-pressed="false" aria-label="選擇' + esc(c.name) +
    '" data-county="' + esc(c.name) + '"><path d="' + c.d + '"/>' + label + '</g>';
}
function calloutHTML(c) {
  const at = CALLOUTS[c.name];

/* ---------- 聲音 ---------- */
let audio, master, muted = false, thud;
function makeThud(ctx) {
  const rate = ctx.sampleRate;
  const buffer = ctx.createBuffer(1, Math.ceil(.18 * rate), rate);
  const samples = buffer.getChannelData(0);
  const pole = hz => 1 - Math.exp(-2 * Math.PI * hz / rate);
  const upper = pole(2300), lower = pole(750);
  let phase = 0, softNoise = 0, lowNoise = 0, seed = 31;
  for (let i = 0; i < samples.length; i++) {
    const t = i / rate;
    phase += 2 * Math.PI * (73 + 82 * Math.exp(-t / .018)) / rate;
    seed = (Math.imul(seed,1664525) + 1013904223) >>> 0;
    softNoise += upper * (seed / 2147483648 - 1 - softNoise);
    lowNoise += lower * (softNoise - lowNoise);
    const thump = .62 * Math.sin(phase) * Math.exp(-t / .035);
    const wood = .18 * Math.sin(2 * Math.PI * 244 * t) * Math.exp(-t / .017);
    const paper = .30 * (softNoise - lowNoise) * Math.exp(-t / .012);
    const envelope = Math.min(1, t / .002, (samples.length - 1 - i) / (.008 * rate));
    samples[i] = envelope * (thump + wood + paper);
  }
  return buffer;
}
function prepareAudio() {
  try {
    if (audio && audio.state === 'closed') audio = master = thud = undefined;
    if (!audio) {
      audio = new (window.AudioContext || window.webkitAudioContext)({latencyHint:'interactive'});
      master = audio.createGain();
      master.gain.value = muted ? 0 : .72;
      master.connect(audio.destination);
      thud = makeThud(audio);
    }
    if (audio.state !== 'running') audio.resume().catch(() => {});
  } catch { /* 沒有音訊的裝置照樣可以閱讀。 */ }
}
function syncMute() {
  document.querySelectorAll('.mute-btn').forEach(btn => {
    btn.setAttribute('aria-pressed', String(muted));
    btn.querySelector('b').textContent = muted ? '關' : '開';
  });
}
function muteHTML(extra) {
  return '<button type="button" class="mute-btn ' + extra + '" aria-label="蓋章聲音" aria-pressed="' + muted +
    '"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 7h3l4-4v12l-4-4H2z"/><path class="waves" d="M12 6q3 3 0 6m2-8q5 5 0 10"/>' +
    '<path class="cross" d="m12 7 4 4m0-4-4 4"/></svg>聲音：<b>' + (muted ? '關' : '開') + '</b></button>';
}

function scheduleSound(contactAt, level = 1) {
  if (muted || !audio || !thud) return;
  const play = () => {
    if (muted || audio.state !== 'running') return;
    const source = audio.createBufferSource();
    source.buffer = thud;
    if (level === 1) source.connect(master);
    else {
      const soft = audio.createGain();
      soft.gain.value = level;
      source.connect(soft);
      soft.connect(master);
    }
    source.onended = () => source.disconnect();
    // 把視覺上的接觸時刻對到裝置的輸出時鐘；換算結果不合理（過去或太久以後）就改用目前時間推算。
    const wait = Math.max(0, (contactAt - performance.now()) / 1000);
    const stamp = audio.getOutputTimestamp?.();
    let when = stamp && stamp.performanceTime > 0
      ? stamp.contextTime + (contactAt - stamp.performanceTime) / 1000
      : audio.currentTime + wait;
    if (!(when >= audio.currentTime && when <= audio.currentTime + wait + .25)) when = audio.currentTime + wait;
    source.start(when, 0);
  };
  // 瀏覽器會在切到別的分頁、鎖螢幕或來電時暫停音訊；回來後第一次蓋章要先喚醒，喚醒後若還來得及就照樣出聲。
  if (audio.state === 'running') play();
  else audio.resume().then(() => { if (performance.now() - contactAt < 400) play(); }).catch(() => {});

// 桌機版面寬時，讀者的前臂延伸到窄欄之外。
function carryAcrossDesk(seat, deadline) {

  layer.className = 'desk-gesture';
  layer.setAttribute('aria-hidden','true');

  function align() {
    const box = anchor.getBoundingClientRect();

    const y = box.top + (box.height - seat.offsetHeight) / 2;
    seat.style.transform = 'translate('+x+'px,'+y+'px) rotate(-3deg)';

async function stamp(button, sheet, hold = motion.read) {

    if (spill > 0) window.scrollBy({top:Math.ceil(spill),behavior:'instant'});

    {transform:'scale(1.65,1.40)',opacity:1,offset:motion.hover/duration,easing:'cubic-bezier(.57,.02,.9,.52)'},

      revealStamp(button, sheet);
      busy = false;
      if (pendingState) { const st = pendingState; pendingState = null; render(st); }
      return;
    }
    removeStamps(sheet);
    clearMarks(sheet);
    answers[index] = {cards:[idx], label:STAMP_WORD};
    button.setAttribute('aria-pressed','true');
    await stamp(button, sheet);
  } else if (action === 'all') {
    clearMarks(sheet);
    answers[index] = {cards:orders[index].slice().sort((a,b) => a - b), label:STAMP_WORD, all:true};
    button.setAttribute('aria-pressed','true');
    await stampAll(sheet);
  } else {
    removeStamps(sheet);
    clearMarks(sheet);
    button.setAttribute('aria-pressed','true');
    answers[index] = {action};
    receipt.textContent = notes[action];
    receipt.classList.toggle('file-mark', action !== 'skip');
    receipt.scrollIntoView({block:'nearest'});
    syncDone(sheet);
    await wait(action === 'skip' ? 380 : 510);
  }
  await leaveQuestion(sheet);
}
async function finishChoosing() {
  if (busy || !answers[index]?.cards?.length) return;
  busy = true;
  await leaveQuestion(main.querySelector('.sheet'));
}

/* ---------- 結果與逐題回顧 ---------- */
function summaryText(picks, shared) {
  if (picks) return '你選了 ' + picks + ' 個做法。|' + (shared ?
    '當中有 ' + shared + ' 個做法|不只一位|候選人寫了，|每位都|各算一個。' : '');
  const totals = Object.keys(actions).map(key => [key, answers.filter(a => a?.action === key).length])
    .filter(([,count]) => count);
  const lead = '你沒有選任何做法。|';
  if (totals.length === 1) {
    const [key,count] = totals[0];
    return lead + (key === 'skip' ? '你略過了全部 ' + count + ' 題。' : '你在全部 ' + count + ' 題都選了「' + actions[key] + '」。');
  }
  return lead + totals.map(([key,count]) => '「' + actions[key] + '」' + count + ' 題').join('、|') + '。';
}
function verbatimHTML(src) {
  return typeset(src.verbatim_segments, src.verbatim);
}
function reviewCard(card, mine) {
  const writers = sources(card);
  const both = writers.length > 1 ? '<p class="both">這個做法，' +
    writers.map(w => unit(w.candidate + ' 號 ' + candidateOf(w.candidate).name)).join('、') + unit('都寫在公報上。') + '</p>' : '';
  return '<section class="review-card' + (mine ? ' mine' : '') + '"><h4>' + typeset(card.summary_segments, card.summary) + '</h4>' + both +
    writers.map(w => '<div class="source"><b>' + w.candidate + ' 號 ' + esc(candidateOf(w.candidate).name) +
      '</b><blockquote>' + verbatimHTML(w) + '</blockquote></div>').join('') + '</section>';
}
function reviewHTML(q, i) {
  const answered = answers[i] || {};
  const chosenIdx = (answered.cards || []).slice().sort((a,b) => a - b);
  const mine = chosenIdx.map(idx => reviewCard(q.cards[idx], true)).join('');
  const rest = q.cards.filter((card, idx) => !chosenIdx.includes(idx));
  const head = answered.all ? '你選了：' + actions.all : answered.action ? '你選了：' + actions[answered.action] : '';
  return '<details class="rq"' + (i === 0 ? ' open' : '') + '><summary><span class="qtag">第 ' + pad(i+1) + ' 件</span>' +
    '<span class="qtitle">' + promptHTML(q) + '</span></summary><div class="rq-body"><p class="rq-label mine-label">你的選擇</p>' +
    (head ? '<p class="review-answer">' + esc(head) + '</p>' : '') + mine +
    (rest.length ? '<p class="rq-label">' + (answered.action ? '這件事的做法' : '其他做法') + '</p>' + rest.map(card => reviewCard(card, false)).join('') : '') +
    '</div></details>';
}
const cardWriters = (q, idx) => sources(q.cards[idx]);
function cardsIn(c) {
  if (Number.isInteger(c.cards_in)) return c.cards_in;
  return place.questions.reduce((sum, q) => sum + q.cards.filter(card => sources(card).some(w => w.candidate === c.number)).length, 0);
}
function tally() {
  let picks = 0, shared = 0;
  const counts = new Map(place.candidates.map(c => [c.number,0]));
  answers.forEach((a,i) => {
    (a?.cards || []).forEach(idx => {
      const writers = cardWriters(place.questions[i], idx);
      picks++;
      if (writers.length > 1) shared++;
      writers.forEach(w => counts.set(w.candidate,counts.get(w.candidate)+1));
    });
  });
  return {picks, shared, counts};
}
function bulletinLink(label) {
  return '<a class="link" href="' + esc(place.bulletin_url) + '" target="_blank" rel="noopener">' + label + '</a>';
}
// 桌機結果頁的左欄比視窗高時，讓它的底部也能在捲動時露出來（sticky 的 top 取負值）。
function fitResultLeft() {
  const left = main.querySelector('.result-left');
  if (!left) return;
  const room = innerHeight - left.offsetHeight - 16;
  left.style.setProperty('--left-top', Math.min(76, room) + 'px');
}
addEventListener('resize', fitResultLeft);
function drawResult() {
  if (firstUnanswered() !== -1) { go(stateOf('q', Math.max(0, firstUnanswered()))); return; }
  setView('result');
  const {picks, shared, counts} = tally();
  const rows = [...place.candidates].sort((a,b) =>
    counts.get(b.number)-counts.get(a.number) || a.number-b.number).map(c =>
    '<li data-candidate="' + c.number + '"><div class="identity"><span class="num">' + c.number + ' 號</span><b>' + esc(c.name) +
    '</b><span class="party">' + esc(partyText(c.party)) +
    '</span></div>' + (cardsIn(c) === 0 ? '' : '<p class="stat">' + unit('你選的做法裡，他寫了 ' + counts.get(c.number) + ' 個。') + unit('題目裡他一共有 ' + cardsIn(c) + ' 個做法。') + '</p>') +
    (cardsIn(c) === 0 ? '<p class="zero">' + esc((c.held_in || 0) > 0 ? NOTE_HELD : NOTE_ABSENT) + '</p>' : '') + '</li>').join('');
  main.innerHTML = '<div class="result-grid"><div class="result-left"><article class="paper result"><div class="field">' + esc(place.county) + '／作答結果</div>' +
    '<h1 class="section-title" tabindex="-1">' + seg(place.office + '辛苦了，|下班。') + '</h1><p class="lead" id="summary">' +
    seg(summaryText(picks,shared)) + '</p><button type="button" class="result-jump" data-nav="review">看逐題回顧</button><p class="hint">依你選到的數量排列，數量相同依號次。</p><ol class="people">' +
    rows + '</ol></article><div class="end-controls"><button type="button" class="text-button" data-nav="last">回上一題</button>' +
    '<button type="button" class="text-button" data-nav="switch">換一個縣市</button>' +
    '<button type="button" class="text-button" data-nav="share">分享這個專題</button>' + bulletinLink('看這個縣市的完整選舉公報') +
    '<span class="share-note" role="status" id="share-note"></span></div></div>' +
    '<section class="paper review result-right" id="review"><div class="field">' + esc(place.county) + '／選舉公報</div>' +
    '<h2 class="section-title">逐題回顧</h2><p class="hint">點題目查看做法與公報原句。</p>' +
    place.questions.map(reviewHTML).join('') + '</section></div><div class="result-method">' + methodHTML() + '</div>';
  fitResultLeft();
  focusTop();
}
function drawNone() {
  setView('none');
  const none = place.empty_reason === 'no_overlap';
  const title = none ? place.county + '沒有題目' : place.county + '的題目還在確認中';
  const sentence = none ? RULE + place.county + '的選舉公報裡沒有符合的組合。'
    : '這個縣市的題目還在確認公報內容，暫時沒有刊出。你可以先看候選人的選舉公報。';
  const rows = place.candidates.map(c => '<li><div class="identity"><span class="num">' + c.number + ' 號</span><b>' +
    esc(c.name) + '</b><span class="party">' + esc(partyText(c.party)) + '</span></div></li>').join('');
  main.innerHTML = '<article class="paper result notice"><div class="field">' + esc(place.county) + '／選舉公報</div>' +
    '<h1 tabindex="-1">' + esc(title) + '</h1><p class="lead">' + esc(sentence) + '</p>' +
    '<ol class="people">' + rows + '</ol>' + bulletinLink('看這個縣市的完整選舉公報') + '</article>' +
    methodHTML() + '<div class="end-controls"><button type="button" class="text-button" data-nav="switch">換一個縣市</button></div>';
  focusTop();
}

/* ---------- 分享 ---------- */
async function share() {
  const note = document.querySelector('#share-note');
  const url = document.querySelector('link[rel=canonical]').href;
  const payload = {title:document.title, text:'這件事，你覺得該怎麼做？', url};
  if (navigator.share) {
    try { await navigator.share(payload); return; }
    catch (error) { if (error && error.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(url);
    note.textContent = '已複製專題連結';
  } catch {
    const box = document.createElement('textarea');
    box.value = url;
    box.setAttribute('readonly','');
    box.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.append(box);
    box.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    box.remove();
    note.textContent = ok ? '已複製專題連結' : url;
  }
}

/* ---------- 事件 ---------- */
function begin() {
  if (!selected) return;
  prepareAudio();
  place = selected;
  run++;
  index = 0;
  answers = [];
  orders = place.questions.map(q => shuffledIndices(q.cards));
  go(stateOf('q', 0));
}
function chooseCounty(el) {
  if (el) pickCounty(el.dataset.county);
}
// 讀者在首頁改選別的縣市時，舊的作答與歷史紀錄一起失效。
function pickCounty(name) {
  if (place && place.county !== name) { place = null; orders = []; answers = []; }
  selectCounty(name);
}
main.addEventListener('click', event => {
  const region = event.target.closest('[data-county]');
  if (region) { chooseCounty(region); return; }
  const button = event.target.closest('button');
  if (!button || busy) return;
  if (button.matches('.card,.action')) { answer(button); return; }
  switch (button.dataset.nav) {
    case 'start': begin(); break;
    case 'none': place = selected; go(stateOf('none')); break;
    case 'back': if (index) go(stateOf('q', index-1)); else go(HOME); break;
    case 'done': finishChoosing(); break;
    case 'last': go(stateOf('q', place.questions.length-1)); break;
    case 'switch': selected = null; go(HOME); break;
    case 'review': {
      const target = document.querySelector('#review h2');
      target.setAttribute('tabindex','-1');
      target.scrollIntoView({block:'start', behavior: reduced.matches ? 'instant' : 'smooth'});
      target.focus({preventScroll:true});
      break;
    }
    case 'share': share(); break;
  }
});
document.querySelector('.brand').addEventListener('click', event => {
  if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) return;
  event.preventDefault();
  if (busy) return;
  place = null; selected = null; answers = []; orders = []; index = 0;
  go(HOME);
});
main.addEventListener('keydown', event => {
  if (event.key !== 'Enter' && event.key !== ' ') return;
  const region = event.target.closest?.('[data-county]');
  if (region && region.matches('g')) { event.preventDefault(); pickCounty(region.dataset.county); main.querySelector('#picked button')?.focus({preventScroll:true}); }
});
main.addEventListener('change', event => {
  if (event.target.id === 'county-select') pickCounty(event.target.value);
});

history.scrollRestoration = 'manual';
history.replaceState(HOME, '');
drawHome();

</script>
