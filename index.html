<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>bonnews 作品展示</title>
<style>
:root{--paper:#faf4ed;--ink:#302820;--muted:#75685c;--line:#dfd0c0;--accent:#f18c79}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;line-height:1.7}
main{max-width:760px;margin:0 auto;padding:72px 24px}
h1{font-size:clamp(32px,6vw,48px);margin:0 0 8px;letter-spacing:-.03em}
p{color:var(--muted);margin:0 0 40px;font-size:17px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
li{border-bottom:1px solid var(--line)}
a{display:block;padding:20px 4px;color:inherit;text-decoration:none}
a:hover{background:var(--accent)}
a b{display:block;font-size:20px}
a span{font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>作品展示</h1>
<p>互動新聞專題的展示版本。</p>
<ul>
<li><a href="/taipei/"><b>台北，你選的是哪一個？</b><span>2026 台北市長選舉政見配對遊戲</span></a></li>
</ul>
</main>
</body>
</html>
